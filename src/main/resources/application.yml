server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/api/v1}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: vms-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/vms_db}
    username: ${DB_USERNAME:vms_app}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  auth:
    username: ${VMS_AUTH_USERNAME:}
    password: ${VMS_AUTH_PASSWORD:}
    token-ttl-seconds: ${VMS_AUTH_TOKEN_TTL_SECONDS:28800}
